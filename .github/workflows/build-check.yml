name: Build & Test Check

# প্রতিটা পুশ ও PR-এ কোড কম্পাইল হয় কিনা আর টেস্ট পাস করে কিনা দেখে।
# এতে ভাঙা কোড কখনো Release পর্যন্ত পৌঁছায় না।
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compile + unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
